name: Build Standalone APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android Build Tools & Platform
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Node.js (For Cordova Standalone APK)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Offline Android APK
        run: |
          npm install -g cordova
          cordova create sk_apk org.sktraders.accounting "SK Traders Accounting"
          
          # Copy your pre-built offline mobile app (www folder & database)
          if [ -d "www" ]; then
            cp -r www/* sk_apk/www/
          elif [ -d "SK_Traders_Android_App/www" ]; then
            cp -r SK_Traders_Android_App/www/* sk_apk/www/
          fi
          
          if [ -d "assets" ]; then
            mkdir -p sk_apk/www/assets
            cp -r assets/* sk_apk/www/assets/
          elif [ -d "SK_Traders_Android_App/assets" ]; then
            mkdir -p sk_apk/www/assets
            cp -r SK_Traders_Android_App/assets/* sk_apk/www/assets/
          fi

          cd sk_apk
          cordova platform add android@13.0.0
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../SK_Traders_Accounting.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: SK_Traders_Accounting_APK
          path: SK_Traders_Accounting.apk
