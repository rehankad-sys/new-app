name: Build Super Accounting APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK & Gradle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Super Accounting Android APK
        run: |
          rm -f config.xml package.json package-lock.json network_security_config.xml
          rm -f www/config.xml Super_Accounting_Android_App/config.xml

          npm install -g cordova
          cordova create super_apk com.superaccounting.app "Super Accounting"
          
          if [ -d "www" ]; then
            cp -r www/* super_apk/www/
          elif [ -d "Super_Accounting_Android_App/www" ]; then
            cp -r Super_Accounting_Android_App/www/* super_apk/www/
          elif [ -f "index.html" ]; then
            cp -f index.html super_apk/www/
          fi
          rm -f super_apk/www/config.xml
          
          mkdir -p super_apk/www/assets
          if [ -d "assets" ]; then
            cp -r assets/* super_apk/www/assets/ 2>/dev/null || true
          elif [ -d "Super_Accounting_Android_App/assets" ]; then
            cp -r Super_Accounting_Android_App/assets/* super_apk/www/assets/ 2>/dev/null || true
          fi
          if [ -f "icon.png" ]; then
            cp -f icon.png super_apk/www/assets/icon.png
          fi

          cd super_apk
          
          sed -i 's|</widget>|  <allow-intent href="tel:*" />\n  <allow-intent href="whatsapp:*" />\n  <allow-intent href="sms:*" />\n  <allow-navigation href="*" />\n  <access origin="*" />\n</widget>|g' config.xml
          
          cordova platform add android@13.0.0

          ICON_FILE=""
          if [ -f "www/assets/icon.png" ]; then
            ICON_FILE="www/assets/icon.png"
          elif [ -f "www/icon.png" ]; then
            ICON_FILE="www/icon.png"
          elif [ -f "www/assets/logo.png" ]; then
            ICON_FILE="www/assets/logo.png"
          fi
          if [ -n "$ICON_FILE" ]; then
            rm -rf platforms/android/app/src/main/res/mipmap-*-v26
            rm -rf platforms/android/app/src/main/res/drawable-v24
            for dir in platforms/android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                rm -f "$dir"/*.xml
                cp -f "$ICON_FILE" "$dir/ic_launcher.png" 2>/dev/null || true
                cp -f "$ICON_FILE" "$dir/ic_launcher_round.png" 2>/dev/null || true
                cp -f "$ICON_FILE" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi
          
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <queries>\n        <package android:name="com.whatsapp" />\n        <package android:name="com.whatsapp.w4b" />\n        <intent>\n            <action android:name="android.intent.action.VIEW" />\n            <data android:scheme="whatsapp" />\n        </intent>\n    </queries>\n    <application android:usesCleartextTraffic="true"|g' "$MANIFEST"

          # Inject Gapless MediaRecorder Audio Bridge + Direct WhatsApp App Launcher + OAuth Interceptor
          MAIN_ACT="platforms/android/app/src/main/java/com/superaccounting/app/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package com.superaccounting.app;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.media.MediaRecorder;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.util.Base64;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.FileInputStream;
          import org.apache.cordova.*;
          import org.apache.cordova.engine.SystemWebViewEngine;
          import org.apache.cordova.engine.SystemWebViewClient;
          import org.json.JSONObject;

          public class MainActivity extends CordovaActivity {
              private boolean isHandlingOAuth = false;
              private MediaRecorder mediaRecorder = null;
              private File audioFile = null;
              private boolean isRecordingAudio = false;

              private void launchNativeWhatsApp(String phone, String text) {
                  try {
                      String cleanPhone = phone != null ? phone.replaceAll("[^0-9]", "") : "";
                      if (cleanPhone.length() == 10) cleanPhone = "91" + cleanPhone;
                      String uriStr = "whatsapp://send?" + (!cleanPhone.isEmpty() ? "phone=" + cleanPhone : "") +
                                      (text != null && !text.isEmpty() ? "&text=" + Uri.encode(text) : "");
                      Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(uriStr));
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      startActivity(intent);
                  } catch (Exception e) {
                      try {
                          Intent webIntent = new Intent(Intent.ACTION_VIEW, Uri.parse("https://wa.me/" + phone));
                          webIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(webIntent);
                      } catch (Exception ignored) {}
                  }
              }

              private boolean interceptExternalAndOAuthUrls(final WebView view, String url) {
                  if (url == null) return false;

                  // 1. Direct Native WhatsApp App Opening
                  if (url.startsWith("whatsapp://") || url.contains("wa.me/") || url.contains("api.whatsapp.com/send")) {
                      try {
                          if (url.startsWith("whatsapp://")) {
                              Intent intent = new Intent(Intent.ACTION_VIEW, Uri.parse(url));
                              intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                              startActivity(intent);
                          } else {
                              Uri uri = Uri.parse(url);
                              String phone = uri.getQueryParameter("phone");
                              if (phone == null && url.contains("wa.me/")) {
                                  phone = uri.getLastPathSegment();
                              }
                              String text = uri.getQueryParameter("text");
                              launchNativeWhatsApp(phone, text);
                          }
                      } catch (Exception ignored) {}
                      return true;
                  }

                  // 2. Direct Phone Dialer Opening
                  if (url.startsWith("tel:")) {
                      try {
                          Intent intent = new Intent(Intent.ACTION_DIAL, Uri.parse(url));
                          intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          startActivity(intent);
                      } catch (Exception ignored) {}
                      return true;
                  }

                  // 3. OAuth Localhost Redirect Interceptor
                  if (url.startsWith("http://localhost") || url.startsWith("http://127.0.0.1")) {
                      if (isHandlingOAuth) return true;
                      isHandlingOAuth = true;
                      try { view.stopLoading(); } catch (Exception ignored) {}
                      Uri uri = Uri.parse(url);
                      final String code = uri.getQueryParameter("code");
                      final String fragment = uri.getFragment();
                      view.loadUrl(launchUrl);
                      view.postDelayed(() -> {
                          isHandlingOAuth = false;
                          try {
                              if (fragment != null && !fragment.isEmpty()) {
                                  String safeFrag = JSONObject.quote(fragment);
                                  view.evaluateJavascript(
                                      "if(window.handleGoogleOAuthFragment){window.handleGoogleOAuthFragment(" + safeFrag + ");}" +
                                      "else{window.location.hash=" + safeFrag + ";}", null);
                              } else if (code != null && !code.isEmpty()) {
                                  String safeCode = JSONObject.quote(code);
                                  view.evaluateJavascript("if(window.handleGoogleOAuthCode){window.handleGoogleOAuthCode(" + safeCode + ");}", null);
                              }
                          } catch (Exception ignored) {}
                      }, 700);
                      return true;
                  }
                  return false;
              }

              private void startGaplessRecording() {
                  try {
                      stopGaplessRecording(false);
                      audioFile = new File(getCacheDir(), "super_voice_cmd.m4a");
                      if (audioFile.exists()) audioFile.delete();

                      mediaRecorder = new MediaRecorder();
                      mediaRecorder.setAudioSource(MediaRecorder.AudioSource.MIC);
                      mediaRecorder.setOutputFormat(MediaRecorder.OutputFormat.MPEG_4);
                      mediaRecorder.setAudioEncoder(MediaRecorder.AudioEncoder.AAC);
                      mediaRecorder.setAudioSamplingRate(16000);
                      mediaRecorder.setAudioEncodingBitRate(64000);
                      mediaRecorder.setOutputFile(audioFile.getAbsolutePath());
                      mediaRecorder.prepare();
                      mediaRecorder.start();
                      isRecordingAudio = true;

                      final WebView wv = (WebView) appView.getEngine().getView();
                      wv.post(() -> wv.evaluateJavascript(
                          "try{ var box = document.querySelector('textarea') || document.getElementById('voiceTranscript');" +
                          "if(box){ box.placeholder = '🔴 रिकॉर्डिंग चालू है... पूरा वाक्य आराम से बोलें, फिर Stop दबाएं'; } }catch(e){}", null));
                  } catch (Exception e) {
                      isRecordingAudio = false;
                  }
              }

              private void stopGaplessRecording(boolean sendToGemini) {
                  if (!isRecordingAudio && mediaRecorder == null) return;
                  isRecordingAudio = false;
                  try {
                      if (mediaRecorder != null) {
                          mediaRecorder.stop();
                      }
                  } catch (Exception ignored) {}
                  try {
                      if (mediaRecorder != null) {
                          mediaRecorder.release();
                      }
                  } catch (Exception ignored) {}
                  mediaRecorder = null;

                  if (sendToGemini && audioFile != null && audioFile.exists() && audioFile.length() > 100) {
                      try {
                          FileInputStream fis = new FileInputStream(audioFile);
                          ByteArrayOutputStream bos = new ByteArrayOutputStream();
                          byte[] buf = new byte[4096];
                          int read;
                          while ((read = fis.read(buf)) != -1) {
                              bos.write(buf, 0, read);
                          }
                          fis.close();
                          final String base64Audio = Base64.encodeToString(bos.toByteArray(), Base64.NO_WRAP);
                          final WebView wv = (WebView) appView.getEngine().getView();
                          wv.post(() -> {
                              String safeB64 = JSONObject.quote(base64Audio);
                              wv.evaluateJavascript(
                                  "if(window.onAndroidAudioRecorded){window.onAndroidAudioRecorded(" + safeB64 + ", 'audio/mp4');}", null);
                          });
                      } catch (Exception ignored) {}
                  }
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);

                  try {
                      final WebView wv = (WebView) appView.getEngine().getView();
                      WebSettings ws = wv.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setMediaPlaybackRequiresUserGesture(false);
                      ws.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
                      CookieManager.getInstance().setAcceptCookie(true);
                      CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true);

                      SystemWebViewEngine engine = (SystemWebViewEngine) appView.getEngine();
                      wv.setWebViewClient(new SystemWebViewClient(engine) {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              if (interceptExternalAndOAuthUrls(view, request.getUrl().toString())) return true;
                              return super.shouldOverrideUrlLoading(view, request);
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              if (interceptExternalAndOAuthUrls(view, url)) return true;
                              return super.shouldOverrideUrlLoading(view, url);
                          }

                          @Override
                          public void onPageStarted(WebView view, String url, Bitmap favicon) {
                              if (interceptExternalAndOAuthUrls(view, url)) return;
                              super.onPageStarted(view, url, favicon);
                          }

                          @Override
                          public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                              if (interceptExternalAndOAuthUrls(view, failingUrl)) return;
                              super.onReceivedError(view, errorCode, description, failingUrl);
                          }

                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              if (request != null && request.getUrl() != null && interceptExternalAndOAuthUrls(view, request.getUrl().toString())) return;
                              super.onReceivedError(view, request, error);
                          }
                      });

                      wv.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startVoice() {
                              runOnUiThread(() -> startGaplessRecording());
                          }

                          @JavascriptInterface
                          public void startContinuousVoice() {
                              runOnUiThread(() -> startGaplessRecording());
                          }

                          @JavascriptInterface
                          public void startAudioRecord() {
                              runOnUiThread(() -> startGaplessRecording());
                          }

                          @JavascriptInterface
                          public void stopVoice() {
                              runOnUiThread(() -> stopGaplessRecording(true));
                          }

                          @JavascriptInterface
                          public void stopAudioRecord() {
                              runOnUiThread(() -> stopGaplessRecording(true));
                          }

                          @JavascriptInterface
                          public void openWhatsApp(String phone, String text) {
                              runOnUiThread(() -> launchNativeWhatsApp(phone, text));
                          }
                      }, "AndroidNativeVoice");

                  } catch (Exception ignored) {}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  stopGaplessRecording(false);
                  super.onDestroy();
              }
          }
          EOF

          CHROME_CLIENT="platforms/android/CordovaLib/src/org/apache/cordova/engine/SystemWebChromeClient.java"
          if [ -f "$CHROME_CLIENT" ]; then
            sed -i 's|public void onPermissionRequest(final PermissionRequest request) {|public void onPermissionRequest(final PermissionRequest request) {\n        request.grant(request.getResources());\n        if (true) return;|g' "$CHROME_CLIENT"
          fi
          
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Super_Accounting.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Super_Accounting_APK
          path: Super_Accounting.apk
