name: Build Super Accounting APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configure Pre-installed Android SDK & Gradle
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin:/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH
          yes | /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager --licenses || true
          /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build Super Accounting Android APK
        run: |
          rm -f config.xml package.json package-lock.json network_security_config.xml
          rm -f www/config.xml Super_Accounting_Android_App/config.xml

          npm install -g cordova
          cordova create super_apk com.superaccounting.app "Super Accounting"
          
          if [ -d "www" ]; then
            cp -r www/* super_apk/www/
          elif [ -d "Super_Accounting_Android_App/www" ]; then
            cp -r Super_Accounting_Android_App/www/* super_apk/www/
          elif [ -f "index.html" ]; then
            cp -f index.html super_apk/www/
          fi
          rm -f super_apk/www/config.xml
          
          mkdir -p super_apk/www/assets
          if [ -d "assets" ]; then
            cp -r assets/* super_apk/www/assets/ 2>/dev/null || true
          elif [ -d "Super_Accounting_Android_App/assets" ]; then
            cp -r Super_Accounting_Android_App/assets/* super_apk/www/assets/ 2>/dev/null || true
          fi
          if [ -f "icon.png" ]; then
            cp -f icon.png super_apk/www/assets/icon.png
          fi

          cd super_apk
          
          sed -i 's|</widget>|  <allow-intent href="tel:*" />\n  <allow-navigation href="*" />\n  <access origin="*" />\n</widget>|g' config.xml
          
          cordova platform add android@13.0.0

          ICON_FILE=""
          if [ -f "www/assets/icon.png" ]; then
            ICON_FILE="www/assets/icon.png"
          elif [ -f "www/icon.png" ]; then
            ICON_FILE="www/icon.png"
          elif [ -f "www/assets/logo.png" ]; then
            ICON_FILE="www/assets/logo.png"
          fi
          if [ -n "$ICON_FILE" ]; then
            rm -rf platforms/android/app/src/main/res/mipmap-*-v26
            rm -rf platforms/android/app/src/main/res/drawable-v24
            for dir in platforms/android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                rm -f "$dir"/*.xml
                cp -f "$ICON_FILE" "$dir/ic_launcher.png" 2>/dev/null || true
                cp -f "$ICON_FILE" "$dir/ic_launcher_round.png" 2>/dev/null || true
                cp -f "$ICON_FILE" "$dir/ic_launcher_foreground.png" 2>/dev/null || true
              fi
            done
          fi
          
          MANIFEST="platforms/android/app/src/main/AndroidManifest.xml"
          sed -i 's|<application|<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.CALL_PHONE" />\n    <queries>\n        <intent>\n            <action android:name="android.speech.RecognitionService" />\n        </intent>\n    </queries>\n    <application android:usesCleartextTraffic="true"|g' "$MANIFEST"

          # Inject Background Continuous Manual Start/Stop SpeechRecognizer + OAuth Interceptor into MainActivity.java
          MAIN_ACT="platforms/android/app/src/main/java/com/superaccounting/app/MainActivity.java"
          cat << 'EOF' > "$MAIN_ACT"
          package com.superaccounting.app;

          import android.Manifest;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.graphics.Bitmap;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.Looper;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          import android.webkit.CookieManager;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebResourceError;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import java.util.ArrayList;
          import org.apache.cordova.*;
          import org.apache.cordova.engine.SystemWebViewEngine;
          import org.apache.cordova.engine.SystemWebViewClient;
          import org.json.JSONObject;

          public class MainActivity extends CordovaActivity {
              private boolean isHandlingOAuth = false;
              private SpeechRecognizer speechRecognizer;
              private Intent recognizerIntent;
              private boolean keepListening = false;
              private StringBuilder fullTranscript = new StringBuilder();
              private final Handler mainHandler = new Handler(Looper.getMainLooper());

              private void sendTextToWeb(String text, boolean isFinalStop) {
                  try {
                      final WebView wv = (WebView) appView.getEngine().getView();
                      final String safeText = JSONObject.quote(text.trim());
                      wv.post(() -> {
                          String js = "try{" +
                              "var box = document.querySelector('textarea') || document.getElementById('voiceTranscript') || document.getElementById('voice-input');" +
                              "if(box){ box.value = " + safeText + "; box.dispatchEvent(new Event('input', {bubbles:true})); }" +
                              "if(window.onAndroidLiveVoice){ window.onAndroidLiveVoice(" + safeText + ", " + isFinalStop + "); }" +
                              (isFinalStop ? "else if(window.onAndroidVoiceResult){ window.onAndroidVoiceResult(" + safeText + "); }" : "") +
                              "}catch(e){}";
                          wv.evaluateJavascript(js, null);
                      });
                  } catch (Exception ignored) {}
              }

              private void startInternalListening() {
                  if (!keepListening) return;
                  try {
                      if (speechRecognizer == null) {
                          speechRecognizer = SpeechRecognizer.createSpeechRecognizer(this);
                          speechRecognizer.setRecognitionListener(new RecognitionListener() {
                              @Override public void onReadyForSpeech(Bundle params) {}
                              @Override public void onBeginningOfSpeech() {}
                              @Override public void onRmsChanged(float rmsdB) {}
                              @Override public void onBufferReceived(byte[] buffer) {}
                              @Override public void onEndOfSpeech() {}
                              @Override public void onEvent(int eventType, Bundle params) {}

                              @Override
                              public void onPartialResults(Bundle partialResults) {
                                  if (!keepListening) return;
                                  ArrayList<String> matches = partialResults.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (matches != null && !matches.isEmpty()) {
                                      String current = (fullTranscript.toString() + " " + matches.get(0)).trim();
                                      sendTextToWeb(current, false);
                                  }
                              }

                              @Override
                              public void onResults(Bundle results) {
                                  ArrayList<String> matches = results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
                                  if (matches != null && !matches.isEmpty() && !matches.get(0).trim().isEmpty()) {
                                      if (fullTranscript.length() > 0) fullTranscript.append(" ");
                                      fullTranscript.append(matches.get(0).trim());
                                      sendTextToWeb(fullTranscript.toString(), false);
                                  }
                                  if (keepListening) {
                                      mainHandler.postDelayed(() -> startInternalListening(), 150);
                                  }
                              }

                              @Override
                              public void onError(int error) {
                                  if (keepListening) {
                                      mainHandler.postDelayed(() -> startInternalListening(), 250);
                                  }
                              }
                          });
                      }
                      if (recognizerIntent == null) {
                          recognizerIntent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                          recognizerIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
                          recognizerIntent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "hi-IN");
                          recognizerIntent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, true);
                          recognizerIntent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 1);
                      }
                      speechRecognizer.startListening(recognizerIntent);
                  } catch (Exception ignored) {}
              }

              private boolean interceptLocalhostOAuth(final WebView view, String url) {
                  if (url != null && (url.startsWith("http://localhost") || url.startsWith("http://127.0.0.1"))) {
                      if (isHandlingOAuth) return true;
                      isHandlingOAuth = true;
                      try { view.stopLoading(); } catch (Exception ignored) {}
                      Uri uri = Uri.parse(url);
                      final String code = uri.getQueryParameter("code");
                      final String fragment = uri.getFragment();
                      view.loadUrl(launchUrl);
                      view.postDelayed(() -> {
                          isHandlingOAuth = false;
                          try {
                              if (fragment != null && !fragment.isEmpty()) {
                                  String safeFrag = JSONObject.quote(fragment);
                                  view.evaluateJavascript(
                                      "if(window.handleGoogleOAuthFragment){window.handleGoogleOAuthFragment(" + safeFrag + ");}" +
                                      "else{window.location.hash=" + safeFrag + ";}", null);
                              } else if (code != null && !code.isEmpty()) {
                                  String safeCode = JSONObject.quote(code);
                                  view.evaluateJavascript("if(window.handleGoogleOAuthCode){window.handleGoogleOAuthCode(" + safeCode + ");}", null);
                              }
                          } catch (Exception ignored) {}
                      }, 700);
                      return true;
                  }
                  return false;
              }

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  Bundle extras = getIntent().getExtras();
                  if (extras != null && extras.getBoolean("cdvStartInBackground", false)) {
                      moveTaskToBack(true);
                  }
                  loadUrl(launchUrl);

                  try {
                      final WebView wv = (WebView) appView.getEngine().getView();
                      WebSettings ws = wv.getSettings();
                      ws.setJavaScriptEnabled(true);
                      ws.setDomStorageEnabled(true);
                      ws.setMediaPlaybackRequiresUserGesture(false);
                      ws.setUserAgentString("Mozilla/5.0 (Linux; Android 14; Pixel 8) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Mobile Safari/537.36");
                      CookieManager.getInstance().setAcceptCookie(true);
                      CookieManager.getInstance().setAcceptThirdPartyCookies(wv, true);

                      SystemWebViewEngine engine = (SystemWebViewEngine) appView.getEngine();
                      wv.setWebViewClient(new SystemWebViewClient(engine) {
                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                              if (interceptLocalhostOAuth(view, request.getUrl().toString())) return true;
                              return super.shouldOverrideUrlLoading(view, request);
                          }

                          @Override
                          public boolean shouldOverrideUrlLoading(WebView view, String url) {
                              if (interceptLocalhostOAuth(view, url)) return true;
                              return super.shouldOverrideUrlLoading(view, url);
                          }

                          @Override
                          public void onPageStarted(WebView view, String url, Bitmap favicon) {
                              if (interceptLocalhostOAuth(view, url)) return;
                              super.onPageStarted(view, url, favicon);
                          }

                          @Override
                          public void onReceivedError(WebView view, int errorCode, String description, String failingUrl) {
                              if (interceptLocalhostOAuth(view, failingUrl)) return;
                              super.onReceivedError(view, errorCode, description, failingUrl);
                          }

                          @Override
                          public void onReceivedError(WebView view, WebResourceRequest request, WebResourceError error) {
                              if (request != null && request.getUrl() != null && interceptLocalhostOAuth(view, request.getUrl().toString())) return;
                              super.onReceivedError(view, request, error);
                          }
                      });

                      wv.addJavascriptInterface(new Object() {
                          @JavascriptInterface
                          public void startVoice() {
                              startContinuousVoice();
                          }

                          @JavascriptInterface
                          public void startContinuousVoice() {
                              runOnUiThread(() -> {
                                  fullTranscript.setLength(0);
                                  keepListening = true;
                                  startInternalListening();
                              });
                          }

                          @JavascriptInterface
                          public void stopVoice() {
                              runOnUiThread(() -> {
                                  keepListening = false;
                                  try {
                                      if (speechRecognizer != null) {
                                          speechRecognizer.stopListening();
                                          speechRecognizer.cancel();
                                      }
                                  } catch (Exception ignored) {}
                                  if (fullTranscript.length() > 0) {
                                      sendTextToWeb(fullTranscript.toString(), true);
                                  }
                              });
                          }
                      }, "AndroidNativeVoice");

                      // Automatically hook the HTML Start & Stop buttons to control native background mic
                      wv.postDelayed(() -> {
                          wv.evaluateJavascript(
                              "document.addEventListener('click', function(e){" +
                              "  var btn = e.target.closest('button');" +
                              "  if(!btn) return;" +
                              "  var txt = (btn.innerText || '');" +
                              "  if(txt.indexOf('Stop') !== -1 || txt.indexOf('रोकें') !== -1){" +
                              "    if(window.AndroidNativeVoice && window.AndroidNativeVoice.stopVoice){ window.AndroidNativeVoice.stopVoice(); }" +
                              "  }" +
                              "}, true);", null);
                      }, 1500);

                  } catch (Exception ignored) {}

                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M) {
                      if (ContextCompat.checkSelfPermission(this, Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED) {
                          ActivityCompat.requestPermissions(this, new String[]{Manifest.permission.RECORD_AUDIO}, 101);
                      }
                  }
              }

              @Override
              public void onDestroy() {
                  keepListening = false;
                  if (speechRecognizer != null) {
                      try { speechRecognizer.destroy(); } catch (Exception ignored) {}
                  }
                  super.onDestroy();
              }
          }
          EOF

          CHROME_CLIENT="platforms/android/CordovaLib/src/org/apache/cordova/engine/SystemWebChromeClient.java"
          if [ -f "$CHROME_CLIENT" ]; then
            sed -i 's|public void onPermissionRequest(final PermissionRequest request) {|public void onPermissionRequest(final PermissionRequest request) {\n        request.grant(request.getResources());\n        if (true) return;|g' "$CHROME_CLIENT"
          fi
          
          cordova build android --debug
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk ../Super_Accounting.apk

      - name: Upload Ready APK
        uses: actions/upload-artifact@v4
        with:
          name: Super_Accounting_APK
          path: Super_Accounting.apk
