name: Build Standalone APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java (JDK 17 for Android)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Flet & Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "flet>=0.24.0" requests

      - name: Build Android APK with Flet
        run: |
          if [ -d "SK_Traders_Android_App" ]; then
            cd SK_Traders_Android_App
          fi
          flet build apk --yes --project "SK_Traders_Accounting"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SK_Traders_Accounting_APK
          path: |
            build/apk/*.apk
            **/build/apk/*.apk
            **/*.apk
